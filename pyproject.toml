[project]
name = "rag2"
version = "0.1.0"
description = "Modular monolith event-driven scaffold"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"fastapi>=0.115.0",
	"psycopg[binary]>=3.3.4",
	"sqlalchemy>=2.0.49",
	"python-dotenv>=1.0.1",
	"uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
	"httpx>=0.27.0",
	"pytest>=8.3.5",
]
